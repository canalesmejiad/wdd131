<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Product Review Form for WDD 131 by David Canales" />
    <meta name="author" content="David Canales" />
    <title>Product Review Form - WDD 131</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Poppins:wght@600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles/base_week05.css" />
</head>

<body>
    <header class="header">
        <h1>Product Review</h1>
    </header>

    <main>
        <section class="form-container">
            <form method="get" action="review.html">
                <label for="product">Product Name <span class="required">*</span></label>
                <select id="product" name="product" required>
                    <option value="" disabled selected>Select a Product ...</option>
                </select>

                <fieldset>
                    <legend>Overall Rating <span class="required">*</span></legend>
                    <div class="rating">
                        <label><input type="radio" name="rating" value="1" required /> ☆</label>
                        <label><input type="radio" name="rating" value="2" /> ☆☆</label>
                        <label><input type="radio" name="rating" value="3" /> ☆☆☆</label>
                        <label><input type="radio" name="rating" value="4" /> ☆☆☆☆</label>
                        <label><input type="radio" name="rating" value="5" /> ☆☆☆☆☆</label>
                    </div>
                </fieldset>

                <label for="installation-date">Date of Installation <span class="required">*</span></label>
                <input type="date" id="installation-date" name="installation-date" required />

                <fieldset>
                    <legend>Which features did you find useful in the product?</legend>
                    <p>(Check all that apply)</p>
                    <label><input type="checkbox" name="features" value="Durability" /> Durability</label>
                    <label><input type="checkbox" name="features" value="Ease of Use" /> Ease of Use</label>
                    <label><input type="checkbox" name="features" value="Performance" /> Performance</label>
                    <label><input type="checkbox" name="features" value="Design" /> Design</label>
                </fieldset>

                <label for="review">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="review" name="review"></textarea>

                <label for="username">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="username" name="username" />

                <input type="submit" value="Post Review" class="submit-button" />
            </form>
        </section>
    </main>

    <footer>
        <p>&copy;2024 David Canales | Vancouver, WA</p>
        <p id="lastModified"></p>
    </footer>

    <script src="scripts/product.js" defer></script>
    <script src="scripts/forms.js" defer></script>
</body>

</html>
