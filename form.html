<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form for WDD 131 by David Canales">
    <meta name="author" content="David Canales">
    <title>Product Review Form - WDD 131</title>

    <!-- Google Fonts (formato clásico, 2 links) -->
    <link href="https://fonts.googleapis.com/css?family=Open+Sans" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css?family=Poppins:600" rel="stylesheet">

    <link rel="stylesheet" href="styles/base_week05.css">
</head>

<body>
    <header class="masthead">
        <h1>Product Review</h1>
    </header>

    <main>
        <section class="card">
            <form method="get" action="review.html">
                <label for="product">Product Name <span class="req">*</span></label>
                <select id="product" name="product" required autocomplete="off">
                    <option value="" disabled selected>Choose a Product …</option>
                </select>

                <fieldset>
                    <legend id="ratingLegend">Overall Rating <span class="req">*</span></legend>
                    <div class="rating-row" role="radiogroup" aria-labelledby="ratingLegend">
                        <label><input type="radio" name="rating" value="1" aria-label="1 star" required><span
                                class="dot"></span></label>
                        <label><input type="radio" name="rating" value="2" aria-label="2 stars"><span
                                class="dot"></span></label>
                        <label><input type="radio" name="rating" value="3" aria-label="3 stars"><span
                                class="dot"></span></label>
                        <label><input type="radio" name="rating" value="4" aria-label="4 stars"><span
                                class="dot"></span></label>
                        <label><input type="radio" name="rating" value="5" aria-label="5 stars"><span
                                class="dot"></span></label>
                    </div>
                </fieldset>

                <label for="installation">Date of Installation <span class="req">*</span></label>
                <input type="date" id="installation" name="installation" required autocomplete="off">

                <fieldset>
                    <legend>Which features did you find useful in the product?</legend>
                    <span class="hint">(Check all that apply)</span>
                    <label class="check"><input type="checkbox" name="features" value="Durability">Durability</label>
                    <label class="check"><input type="checkbox" name="features" value="Ease of Use">Ease of Use</label>
                    <label class="check"><input type="checkbox" name="features" value="Performance">Performance</label>
                    <label class="check"><input type="checkbox" name="features" value="Design">Design</label>
                </fieldset>

                <label for="review">Written Review <span class="optional">(Optional)</span></label>
                <textarea id="review" name="review" rows="6" autocomplete="off"></textarea>

                <label for="username">Your Name <span class="optional">(Optional)</span></label>
                <input type="text" id="username" name="username" autocomplete="name">

                <!-- Submit EXACTO para el auditor -->
                <input type="submit" value="Submit" class="btn-large">
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; <span id="year"></span> WDD 131 | Product Reviews | David Canales</p>
        <p id="lastModified"></p>
    </footer>

    <!-- Scripts al final, SIN defer -->
    <script src="scripts/product.js"></script>
    <script src="scripts/forms.js"></script>
    <script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>

</html>
