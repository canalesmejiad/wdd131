<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Review Confirmation - WDD 131 by David Canales" />
    <meta name="author" content="David Canales" />
    <title>Review Confirmation - WDD 131</title>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&family=Poppins:wght@600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles/base_week05.css" />
</head>

<body>
    <main class="review-confirmation">
        <h1>Thank You for Your Review!</h1>
        <p>Your product review has been successfully submitted.</p>
        <p>Total reviews completed: <span id="review-count">0</span></p>
    </main>

    <footer>
        <p>&copy;2024 David Canales | Vancouver, WA</p>
        <p id="lastModified"></p>
    </footer>

    <script>
        let count = Number(localStorage.getItem("reviewCount")) || 0;
        count++;
        localStorage.setItem("reviewCount", count);
        document.querySelector("#review-count").textContent = count;
        document.querySelector("#lastModified").textContent = `Last Modification: ${document.lastModified}`;
    </script>
</body>

</html>
