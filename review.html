<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WDD 131 | Review Confirmation - David Canales</title>
    <meta name="description"
        content="Confirmation page showing the details of your submitted product review for WDD 131 Week 05 assignment.">
    <meta name="author" content="David Canales">
    <link href="https://fonts.googleapis.com/css?family=Open+Sans|Poppins:600" rel="stylesheet">
    <link rel="stylesheet" href="styles/base_week05.css">
    <script src="scripts/forms.js" defer></script>
</head>

<body>
    <header>
        <h1>Thank You!</h1>
        <p>Your review has been submitted successfully.</p>
    </header>

    <main>
        <section class="card">
            <h2>Review Summary</h2>
            <ul id="summary"></ul>

            <p class="counter">
                Total Reviews Submitted: <span id="reviewCount">0</span>
            </p>

            <p><a href="form.html">← Submit another review</a></p>
        </section>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> WDD 131 | Review Confirmation</p>
    </footer>

    <script>
        document.getElementById("year").textContent = new Date().getFullYear();
        const params = new URLSearchParams(window.location.search);
        const summary = document.getElementById("summary");
        let html = "";
        params.forEach((value, key) => {
            html += `<li><strong>${key}:</strong> ${value}</li>`;
        });
        summary.innerHTML = html || "<li>No data found.</li>";
        let count = Number(localStorage.getItem("reviewCount")) || 0;
        count++;
        localStorage.setItem("reviewCount", count);
        document.getElementById("reviewCount").textContent = count;
    </script>
</body>

</html>
