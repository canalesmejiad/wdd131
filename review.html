<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product review confirmation page for WDD 131 by David Canales.">
    <meta name="author" content="David Canales">
    <title>Review Confirmation - WDD 131</title>

    <!-- Google Fonts (formato clásico, un link por familia) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="styles/base_week05.css">
</head>

<body>
    <header>
        <h1>Thank You for Your Review!</h1>
    </header>

    <main>
        <p>Your product review has been successfully submitted.</p>
        <p>Total reviews submitted from this browser: <span id="reviewCount"></span></p>
        <a href="form.html" class="button">Submit Another Review</a>
    </main>

    <footer>
        <p>&copy; <span id="year"></span> | Product Reviews | WDD 131 | David Canales</p>
    </footer>

    <!-- Sin defer; al final -->
    <script>
        let count = Number(localStorage.getItem("reviewCount")) || 0;
        count++;
        localStorage.setItem("reviewCount", count);
        document.getElementById("reviewCount").textContent = count;
        document.getElementById("year").textContent = new Date().getFullYear();
    </script>
</body>

</html>
