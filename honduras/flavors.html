<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Honduran Flavors — Gallery</title>
    <meta name="description"
        content="Taste Honduras: baleadas, tamales, horchata and highland coffee in a delicious gallery.">
    <meta name="theme-color" content="#0d4ea6">
    <meta property="og:title" content="Honduran Flavors — Gallery">
    <meta property="og:description" content="Baleadas, tamales, horchata and Honduran highland coffee.">
    <meta property="og:type" content="website">
    <link rel="icon" href="favicon.ico">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="styles/gallery.css">
</head>

<body>
    <header class="g-header">
        <a class="back" href="index.html#main">← Back</a>
        <h1>Authentic Flavors</h1>
        <p>Baleadas • Tamales • Coffee</p>
    </header>

    <main class="g-container">
        <div class="grid">
            <figure>
                <img src="https://hl-grocery-prod-master.imgix.net/imgix/recipes/0861911088a0049fd8f7979b7f65dd98faceca6e"
                    alt="Baleadas" width="1200" height="800" loading="lazy" decoding="async">
                <figcaption>Baleadas — the national dish of Honduras</figcaption>
            </figure>

            <figure>
                <img src="https://i.pinimg.com/736x/20/91/12/2091126d1fbcea992a4062e50b1be0a4.jpg"
                    alt="Honduran Tamales" width="736" height="736" loading="lazy" decoding="async">
                <figcaption>Traditional Honduran Tamales</figcaption>
            </figure>

            <figure>
                <img src="https://cornercoffeestore.com/wp-content/uploads/2021/09/Flag-of-Honduras-sticking-in-roasted-coffee-beans._Per-bengtsson_Shutterstock.jpg"
                    alt="Honduran Coffee" width="1200" height="800" loading="lazy" decoding="async">
                <figcaption>Honduran Coffee from the Highlands</figcaption>
            </figure>

            <figure>
                <img src="https://familiakitchen.com/wp-content/uploads/2022/09/iStock-1217713217-Horchata-2.jpg"
                    alt="Horchata" width="1218" height="813" loading="lazy" decoding="async">
                <figcaption>Refreshing Honduran Horchata</figcaption>
            </figure>

            <figure>
                <img src="https://buenprovecho.hn/wp-content/uploads/2019/08/Catrachitas-2.jpg" alt="Catrachas"
                    width="1200" height="800" loading="lazy" decoding="async">
                <figcaption>Catrachas — Corn Chips with Beans and Cheese</figcaption>
            </figure>

            <figure>
                <img src="https://www.baconismagic.ca/wp-content/uploads/2010/06/honduran-food-desayuno-tipico.jpg"
                    alt="Desayuno Típico" width="1200" height="800" loading="lazy" decoding="async">
                <figcaption>Desayuno Típico — Plantains, Eggs, and Cream</figcaption>
            </figure>
        </div>
    </main>

    <footer class="site-footer">
        <p>&copy; 2025 Discover Honduras • David Canales</p>
    </footer>
</body>

</html>
