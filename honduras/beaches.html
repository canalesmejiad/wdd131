<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Honduras Beaches — Gallery</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles/gallery.css" />
</head>

<body>
    <header class="g-header">
        <a class="back" href="index.html#main">← Back</a>
        <h1>Incredible Beaches</h1>
        <p>Roatán • Utila • Tela</p>
    </header>

    <main class="g-container">
        <div class="grid">
            <figure>
                <img src="https://upload.wikimedia.org/wikipedia/commons/1/15/West_Bay_Beach_-Roatan_-Honduras-23May2009-d.jpg"
                    alt="West Bay, Roatán">
                <figcaption>West Bay, Roatán</figcaption>
            </figure>

            <figure>
                <img src="https://www.zubludiving.com/images/Honduras/Utila/Utila-Honduras-Scuba-Diving-banner.jpg"
                    alt="Utila Bay">
                <figcaption>Utila Bay</figcaption>
            </figure>

            <figure>
                <img src="https://www.visitcentroamerica.com/wp-content/uploads/2025/04/Tela-City-Aerial-View-Honduras-Centroamerica-05.webp"
                    alt="Tela Beach">
                <figcaption>Tela Beach</figcaption>
            </figure>

            <figure>
                <img src="https://sallysees.com/wp-content/uploads/2024/02/Honduras-Roatan-West-End-Streets-Drone-Main-Street-1024x576.jpg"
                    alt="West End, Roatán">
                <figcaption>West End, Roatán</figcaption>
            </figure>

            <figure>
                <img src="https://images.squarespace-cdn.com/content/v1/5596959de4b0f75fd296dbe4/f29b97f7-504f-491e-8200-d6df960f7a1a/Green+Turtle+Roatan"
                    alt="Coral Reef and Turtle, Roatán">
                <figcaption>Coral Reef and Turtle, Roatán</figcaption>
            </figure>

            <figure>
                <img src="https://images.fineartamerica.com/images/artworkimages/mediumlarge/1/sunset-in-utila-honduras-ashwin-atre.jpg"
                    alt="Sunset in Utila">
                <figcaption>Sunset in Utila</figcaption>
            </figure>
        </div>
    </main>
</body>

</html>
