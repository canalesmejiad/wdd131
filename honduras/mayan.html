<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />

    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap"

    <header class="g-header">

    <main class="g-container">
        <div class="grid">
            <figure>
                <img src="https://www.doaks.org/resources/online-exhibits/past-and-present-views-of-maya-monuments/images/Plate%20I%20Right%20Image.jpg/@@images/17288c22-d5ac-4a49-9df6-3786fcf3feaa.jpeg"

                <figcaption>Stelae at Copán</figcaption>
            </figure>

            <figure>
                <img src="https://c8.alamy.com/comp/EN1AYC/ancient-mayan-acropolis-copan-honduras-EN1AYC.jpg"

            <figure>
                <img src="https://kids.kiddle.co/images/thumb/1/1e/Copan_%283831024263%29.jpg/300px-Copan_%283831024263%29.jpg"

                <figcaption>Monument 63, Copán</figcaption>
            </figure>
        </div>
    </main>
