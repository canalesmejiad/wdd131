<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact | Discover Honduras</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Inter:wght@400;600&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="styles/base.css" />
</head>

<body>
    <a class="skip-link" href="#main">Skip to content</a>

    <header class="site-header">
        <div class="brand">
            <h1>Discover Honduras</h1>
        </div>

        <button id="navToggle" class="nav-toggle" aria-label="Open menu" aria-expanded="false"
            aria-controls="primaryNav">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </button>

        <nav id="primaryNav" class="nav" role="navigation" aria-label="Primary">
            <a href="index.html">Home</a>
            <a href="culture.html">Culture</a>
            <a href="food.html">Food</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main id="main">
        <section>
            <h2>Contact Us</h2>
            <p>Questions or looking for more information about Honduras? Send us a message:</p>

            <form class="contact-form" action="#" method="post" novalidate>
                <label for="name">Name <span class="req">*</span></label>
                <input type="text" id="name" name="name" autocomplete="name" required />

                <label for="email">Email <span class="req">*</span></label>
                <input type="email" id="email" name="email" autocomplete="email" required />

                <label for="message">Message <span class="req">*</span></label>
                <textarea id="message" name="message" rows="5" required></textarea>

                <button type="submit" class="btn">Send</button>
            </form>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; <span id="year"></span> Discover Honduras • David Canales</p>
    </footer>

    <script src="scripts/main.js"></script>
</body>

</html>
